<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Una página sencilla para practicar despliegues con GitHub y Railway.">
  <title>Holiii</title>

 
</head>

<body>
  <div class="decoracion uno" aria-hidden="true"></div>
  <div class="decoracion dos" aria-hidden="true"></div>

  <main>
    <div class="etiqueta">
      <span class="punto"></span>
      (♡ˊ͈ ꒳ ˋ͈)
    </div>

   <h1 id="frase">¡Tú puedes!:3</h1>

    <p class="descripcion">
      Una página sencilla y bonita que genera frases motivacionales.
    </p>

 <button id="boton" type="button">Cambiar frase </button>

    <footer>Hecho con HTML, CSS y un poquito de JavaScript ✦</footer>
  </main>
<script>
  const boton = document.querySelector("#boton");
  const frase = document.querySelector("#frase");

  const frasesMotivacionales = [
    "Tú puedes con todo lo que te propongas.",
    "Cada pequeño paso cuenta.",
    "Confía en ti, vas mejor de lo que crees.",
    "No te rindas, estás más cerca de lo que piensas.",
    "Hoy es un buen día para intentarlo de nuevo.",
    "Los grandes cambios comienzan con pequeños pasos.",
    "Cree en tu proceso.",
    "Hazlo a tu ritmo, pero nunca dejes de avanzar.",
    "Eres capaz de lograr cosas increíbles.",
    "Tu esfuerzo de hoy construye tu futuro.",
    "No necesitas ser perfecta, solo seguir adelante.",
    "Después de un día difícil también sale el sol.",
    "Puedes hacerlo, incluso si ahora parece complicado.",
    "Tu progreso merece ser celebrado.",
    "Sé paciente contigo misma."
  ];

function cambiarFrase() {
  const indiceAleatorio = Math.floor(
    Math.random() * frasesMotivacionales.length
  );

  frase.textContent = frasesMotivacionales[indiceAleatorio];

  ajustarTamañoFrase();
}

function cambiarFrase() {
  const indiceAleatorio = Math.floor(
    Math.random() * frasesMotivacionales.length
  );

  frase.textContent = frasesMotivacionales[indiceAleatorio];

  ajustarTamañoFrase();
}

function ajustarTamañoFrase() {
  const tamañoMaximo = 4;
  const tamañoMinimo = 3;

  let tamaño = tamañoMaximo;

  frase.style.fontSize = `${tamaño}rem`;

  while (
    (frase.scrollHeight > frase.clientHeight ||
      frase.scrollWidth > frase.clientWidth) &&
    tamaño > tamañoMinimo
  ) {
    tamaño -= 0.05;
    frase.style.fontSize = `${tamaño}rem`;
  }
}

boton.addEventListener("click", cambiarFrase);

window.addEventListener("resize", () => {
  ajustarTamañoFrase();
});

cambiarFrase();

boton.addEventListener("click", cambiarFrase);

window.addEventListener("resize", ajustarTamañoFrase);

cambiarFrase();
</script>
</body>
</html>
