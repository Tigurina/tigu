<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Una página sencilla para practicar despliegues con GitHub y Railway.">
  <title>Holiii</title>

  <style>
    :root {
      --fondo: #efcfe3;
      --tarjeta: rgba(226, 115, 150, 0.88);
      --texto: #fff9fb;
      --suave: #69657d;
      --morado: #b3dee2;
      --celeste: #eb9ab2;
      --borde: rgba(157, 193, 131, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      color: var(--texto);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 194, 208, 0.25), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(252, 232, 240, 0.25), transparent 30%),
        var(--fondo);
    }

    .decoracion {
      position: fixed;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.45;
      pointer-events: none;
    }

    .decoracion.uno {
      top: -95px;
      right: -70px;
      background: linear-gradient(135deg, var(--morado), #b5a4ff);
    }

    .decoracion.dos {
      bottom: -120px;
      left: -70px;
      background: linear-gradient(135deg, var(--celeste), #b7eff8);
    }

   main {
  width: min(100%, 780px);
  height: 560px;
  padding: clamp(32px, 7vw, 70px);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;

  border: 1px solid var(--borde);
  border-radius: 30px;
  background: var(--tarjeta);

  box-shadow: 0 24px 70px rgba(50, 39, 110, 0.14);
  backdrop-filter: blur(12px);

  animation: aparecer 700ms ease-out both;

  overflow: hidden;
}

    .etiqueta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 8px 14px;
      color: #45132e;
      font-size: 0.82rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--borde);
      border-radius: 999px;
      background: #f8f6ff;
    }

    .punto {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #45132e;
      box-shadow: 0 0 0 4px rgba(42, 203, 145, 0.16);
    }

 h1 {
  width: 100%;
  max-width: 680px;

  height: 170px;
  margin: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: clamp(2rem, 6vw, 4.8rem);
  line-height: 1.05;
  letter-spacing: -0.055em;

  overflow-wrap: break-word;
  word-break: normal;

  transition: font-size 200ms ease;
}

    h1 span {
      color: transparent;
      background: linear-gradient(110deg, var(--morado), var(--celeste));
      background-clip: text;
      -webkit-background-clip: text;
    }

.descripcion {
  width: 100%;
  max-width: 560px;
  min-height: 60px;

  margin: 24px auto 30px;

  color: #45132e;
  font-size: clamp(1rem, 2.5vw, 1.18rem);
  line-height: 1.7;
}

    button {
      padding: 14px 22px;
      color: white;
      font: inherit;
      font-weight: 750;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(110deg, var(--morado), #ffcce0);
      box-shadow: 0 12px 24px rgba(109, 74, 255, 0.25);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 28px rgba(109, 74, 255, 0.32);
    }

    button:active {
      transform: translateY(0);
    }

    #mensaje {
      min-height: 24px;
      margin: 18px 0 0;
      color: var(--morado);
      font-weight: 700;
    }

    footer {
      margin-top: 32px;
      color: #928ea3;
      font-size: 0.86rem;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

   @media (max-width: 600px) {
  main {
    width: 100%;
    height: 560px;
    padding: 30px 22px;
  }

  h1 {
    height: 160px;
    font-size: clamp(1.8rem, 9vw, 3rem);
  }
}
  </style>
</head>

<body>
  <div class="decoracion uno" aria-hidden="true"></div>
  <div class="decoracion dos" aria-hidden="true"></div>

  <main>
    <div class="etiqueta">
      <span class="punto"></span>
      (♡ˊ͈ ꒳ ˋ͈)
    </div>

   <h1 id="frase">¡Tú puedes!:3</h1>

    <p class="descripcion">
      Una página sencilla y bonita que genera frases motivacionales.
    </p>

 <button id="boton" type="button">Cambiar frase </button>

    <footer>Hecho con HTML, CSS y un poquito de JavaScript ✦</footer>
  </main>
<script>
  const boton = document.querySelector("#boton");
  const frase = document.querySelector("#frase");

  const frasesMotivacionales = [
    "Tú puedes con todo lo que te propongas.",
    "Cada pequeño paso cuenta.",
    "Confía en ti, vas mejor de lo que crees.",
    "No te rindas, estás más cerca de lo que piensas.",
    "Hoy es un buen día para intentarlo de nuevo.",
    "Los grandes cambios comienzan con pequeños pasos.",
    "Cree en tu proceso.",
    "Hazlo a tu ritmo, pero nunca dejes de avanzar.",
    "Eres capaz de lograr cosas increíbles.",
    "Tu esfuerzo de hoy construye tu futuro.",
    "No necesitas ser perfecta, solo seguir adelante.",
    "Después de un día difícil también sale el sol.",
    "Puedes hacerlo, incluso si ahora parece complicado.",
    "Tu progreso merece ser celebrado.",
    "Sé paciente contigo misma."
  ];

function cambiarFrase() {
  const indiceAleatorio = Math.floor(
    Math.random() * frasesMotivacionales.length
  );

  frase.textContent = frasesMotivacionales[indiceAleatorio];

  ajustarTamañoFrase();
}

function ajustarTamañoFrase() {
  let tamaño = 4.8;

  frase.style.fontSize = `${tamaño}rem`;

  while (
    (frase.scrollHeight > frase.clientHeight ||
      frase.scrollWidth > frase.clientWidth) &&
    tamaño > 2
  ) {
    tamaño -= 0.1;
    frase.style.fontSize = `${tamaño}rem`;
  }
}

boton.addEventListener("click", cambiarFrase);

window.addEventListener("resize", ajustarTamañoFrase);

cambiarFrase();
</script>
</body>
</html>
